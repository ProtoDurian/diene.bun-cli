name: CD

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ### bun-cli-release
  # #### source: bun-cli
  goreleaser:
    name: GoReleaser Publish
    permissions:
      contents: write
    uses: ./.github/workflows/⚡reusable-goreleaser.yaml
    secrets: inherit
    with:
      nix_cache_tag: nix-store-cache-bun-ubuntu-26.04-amd64

  docker:
    name: Docker Image
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/⚡reusable-docker.yaml
    secrets: inherit
    with:
      image_name: diene-bun-cli
      dockerfile: ./infra/Dockerfile
      version: ${{ github.ref_name }}
